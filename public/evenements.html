<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Redirection – DZAÏR</title>
    <meta name="robots" content="noindex" />
    <link
      rel="canonical"
      href="https://adessrrrr.github.io/dzair_epfl/evenements/"
    />
    <!-- Keep ?categorie=… and #ancre from old links. -->
    <script>
      location.replace(
        new URL("./evenements/" + location.search + location.hash, location.href),
      );
    </script>
    <meta http-equiv="refresh" content="0; url=./evenements/" />
  </head>
  <body>
    <p>
      Cette page a déménagé&nbsp;:
      <a href="./evenements/">voir nos événements</a>.
    </p>
  </body>
</html>
