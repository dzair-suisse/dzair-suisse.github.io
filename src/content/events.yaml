# Événements de DZAÏR.
# Pour ajouter un événement : copier un bloc, choisir un identifiant (id) unique,
# déposer la photo dans src/assets/events/ et renseigner les champs.
# - date : utiliser le premier jour du mois (seuls le mois et l’année sont affichés)
# - campus : EPFL | UNIL | Hors campus
# - category : epfl-unil | networking | celebrations
# - image : chemin relatif à ce fichier
# - alt : description de l’image en français (accessibilité)
# - fit : contain (affiche, montrée en entier) | cover (photo, recadrée ; par défaut)
# - en : version anglaise (facultative) : title, alt et, si le nom diffère en
#   anglais, location. Sans elle, le site anglais affiche les textes français.

