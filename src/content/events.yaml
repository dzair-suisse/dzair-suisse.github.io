# Événements de DZAÏR.
# Pour ajouter un événement : copier un bloc, choisir un identifiant (id) unique,
# déposer la photo dans src/assets/events/ et renseigner les champs.
# - date : utiliser le premier jour du mois (seuls le mois et l'année sont affichés)
